# Supervised Fine-Tuning (SFT) Configuration for Japanese AI Tutor
# Tuned specifically for NVIDIA GeForce RTX 4050 Laptop GPU (5.72 GB usable VRAM)

model:
  base_model_id: "Qwen/Qwen2.5-1.5B-Instruct"
  fallback_model_id: "Qwen/Qwen2.5-3B-Instruct"
  torch_dtype: "bfloat16"
  trust_remote_code: true

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

peft_lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "adapters/japanese-ai-tutor-qlora"
  smoke_test_dir: "adapters/japanese-ai-tutor-smoke-test"
  max_seq_length: 512       # 512 for smoke test, 1024 for full training
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_steps: 1
  num_train_epochs: 1       # 1 for smoke test, 3 for full fine-tuning
  logging_steps: 1
  save_strategy: "steps"
  save_steps: 5
  save_total_limit: 2
  eval_strategy: "steps"
  eval_steps: 5
  bf16: true
  fp16: false
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  seed: 42
  report_to: "none"
